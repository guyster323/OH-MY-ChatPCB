name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      # Panel Playwright tests fail when CI is set and Chromium is missing.
      # Linux also needs the browser's system libraries.
      - name: Install Playwright Chromium
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright Chromium
        if: runner.os != 'Linux'
        run: npx playwright install chromium

      - name: Run lint
        run: npm run lint

      # KiCad is not installed on CI runners. Tests use the bundled fixture
      # libraries under tests/fixtures/kicad-libraries. kicad-cli is faked in
      # unit tests, or skipped with a reason when a real binary would be required.
      - name: Run tests
        run: npm test
